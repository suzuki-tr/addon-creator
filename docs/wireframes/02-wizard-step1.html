<!DOCTYPE html>
<html lang="ja">
<!--
  画面名: ウィザード Step 1 — アドオンの種類選択
  対象ユーザー: 全ユーザー
  主要な操作: モブ/ブロック/アイテムの選択
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウィザード Step 1 — ワイヤーフレーム #02</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Noto Sans JP', sans-serif;
      background: #F9FAFB;
      color: #111827;
      min-height: 100vh;
    }

    /* ===== メタバナー ===== */
    .meta-banner {
      background: #FFD700;
      padding: 10px 24px;
      border-bottom: 2px solid #C8960C;
    }
    .meta-banner-inner { max-width: 900px; margin: 0 auto; }
    .meta-banner-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #78580A;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .meta-banner-title { font-size: 1rem; font-weight: 700; color: #1a1a1a; }
    .meta-banner-desc { font-size: 0.8rem; color: #554400; margin-top: 2px; }

    /* ===== ヘッダー ===== */
    .header {
      background: #fff;
      border-bottom: 1px solid #E5E7EB;
      padding: 10px 24px;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-box {
      width: 140px;
      height: 36px;
      background: #D1D5DB;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: #6B7280;
      flex-shrink: 0;
    }
    .header-spacer { flex: 1; }
    .lang-select {
      padding: 5px 10px;
      border: 1px solid #D1D5DB;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      background: #fff;
      color: #374151;
      cursor: pointer;
    }
    .mode-toggle {
      display: flex;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      overflow: hidden;
    }
    .mode-toggle button {
      padding: 5px 14px;
      border: none;
      background: #F3F4F6;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      color: #6B7280;
    }
    .mode-toggle button.active {
      background: #5D9C3B;
      color: #fff;
      font-weight: 600;
    }

    /* ===== ウィザード本体 ===== */
    .wizard-wrap {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* プログレスバー */
    .progress-area {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .progress-label {
      font-size: 0.8rem;
      color: #6B7280;
      margin-bottom: 12px;
    }
    .progress-steps {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .step-item:last-child { flex: 0; }
    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #D1D5DB;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #9CA3AF;
      flex-shrink: 0;
    }
    .step-dot.current {
      background: #5D9C3B;
      border-color: #5D9C3B;
      color: #fff;
    }
    .step-dot.done {
      background: #5D9C3B;
      border-color: #5D9C3B;
      color: #fff;
    }
    .step-line {
      flex: 1;
      height: 2px;
      background: #E5E7EB;
    }
    .step-line.done { background: #5D9C3B; }
    .step-name {
      font-size: 0.75rem;
      color: #9CA3AF;
      white-space: nowrap;
      margin-left: 6px;
    }
    .step-name.current { color: #5D9C3B; font-weight: 600; }

    /* メインカード */
    .wizard-card {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .wizard-heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }
    .wizard-subheading {
      font-size: 0.9rem;
      color: #6B7280;
      margin-bottom: 28px;
    }

    /* 種別選択カード */
    .type-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .type-card {
      border: 2px solid #E5E7EB;
      border-radius: 10px;
      padding: 24px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .type-card:hover {
      border-color: #5D9C3B;
    }
    .type-card.selected {
      border-color: #5D9C3B;
      background: #F0F8EA;
    }
    .type-card-selected-badge {
      display: inline-block;
      background: #5D9C3B;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: 10px;
    }
    .type-card-icon {
      width: 64px;
      height: 64px;
      background: #D1D5DB;
      border-radius: 8px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: #6B7280;
    }
    .type-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }
    .type-card-desc {
      font-size: 0.8rem;
      color: #6B7280;
      line-height: 1.55;
    }

    /* ナビゲーションボタン */
    .wizard-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-nav-cancel {
      background: none;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #6B7280;
      cursor: pointer;
    }
    .btn-nav-next {
      background: #5D9C3B;
      border: none;
      border-radius: 6px;
      padding: 10px 28px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }
    .btn-nav-next:disabled {
      background: #D1D5DB;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- メタバナー -->
  <div class="meta-banner">
    <div class="meta-banner-inner">
      <div class="meta-banner-label">ワイヤーフレーム #02</div>
      <div class="meta-banner-title">ウィザード Step 1 — アドオンの種類選択</div>
      <div class="meta-banner-desc">モブ・ブロック・アイテムから作りたいものを選ぶ</div>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-box">アプリロゴ（プレースホルダー）</div>
      <div class="header-spacer"></div>
      <select class="lang-select">
        <option>日本語</option>
        <option>English</option>
        <option>かんたん日本語</option>
      </select>
      <div class="mode-toggle">
        <button class="active">かんたん</button>
        <button>くわしい</button>
      </div>
    </div>
  </header>

  <!-- ウィザード本体 -->
  <div class="wizard-wrap">

    <!-- プログレスバー -->
    <div class="progress-area">
      <div class="progress-label">1 / 3 ステップ</div>
      <div class="progress-steps">
        <div class="step-item">
          <div class="step-dot current">1</div>
          <span class="step-name current">種類を選ぶ</span>
          <div class="step-line"></div>
        </div>
        <div class="step-item">
          <div class="step-dot">2</div>
          <span class="step-name">基本情報</span>
          <div class="step-line"></div>
        </div>
        <div class="step-item">
          <div class="step-dot">3</div>
        </div>
        <span class="step-name" style="margin-left:6px;">確認・生成</span>
      </div>
    </div>

    <!-- 選択カード -->
    <div class="wizard-card">
      <h1 class="wizard-heading">何を作りますか？</h1>
      <p class="wizard-subheading">作りたいものの種類をひとつ選んでください。あとで変えることもできます。</p>

      <div class="type-cards">

        <!-- モブ（選択済み状態の例） -->
        <div class="type-card selected">
          <div class="type-card-selected-badge">✓ 選択中</div>
          <div class="type-card-icon">アイコン<br>プレースホルダー</div>
          <div class="type-card-title">🐾 モブ（生き物）</div>
          <div class="type-card-desc">敵・味方・ボスなどの生き物を作れます</div>
        </div>

        <!-- ブロック -->
        <div class="type-card">
          <div class="type-card-icon">アイコン<br>プレースホルダー</div>
          <div class="type-card-title">🧱 ブロック</div>
          <div class="type-card-desc">世界に置けるオリジナルブロックを作れます</div>
        </div>

        <!-- アイテム -->
        <div class="type-card">
          <div class="type-card-icon">アイコン<br>プレースホルダー</div>
          <div class="type-card-title">⚔️ アイテム</div>
          <div class="type-card-desc">道具・食べ物・武器などを作れます</div>
        </div>

      </div>
    </div>

    <!-- ナビゲーション -->
    <div class="wizard-nav">
      <button class="btn-nav-cancel">キャンセル</button>
      <button class="btn-nav-next">次へ →</button>
    </div>

  </div>

</body>
</html>
